name: Type check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  basedpyright:
    runs-on: ubuntu-latest

    steps:
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r laps-runner/requirements.txt \
            -r laps-client/requirements.txt \
            -r laps-client/requirements-barcode.txt \
            basedpyright==1.40.2

      # Findings that already exist are recorded in .basedpyright/baseline.json;
      # only new ones fail the job. Regenerate with: basedpyright --writebaseline
      - name: Run basedpyright
        run: basedpyright
